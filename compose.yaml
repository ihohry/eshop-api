services:
  db:
    image: postgres:17
    container_name: eshop-db
    environment:
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: eshop_dev_password
      POSTGRES_DB: eshop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eshop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eshop-db-data: